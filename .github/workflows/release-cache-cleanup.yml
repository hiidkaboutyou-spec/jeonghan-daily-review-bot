name: Release Legacy Cache Cleanup

on:
  push:
    branches:
      - agent/full-end-to-end-audit
    paths:
      - ".github/workflows/release-cache-cleanup.yml"

permissions:
  contents: read
  actions: write

jobs:
  delete-legacy-state-caches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete only legacy Jeonghan state caches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          import urllib.request

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]
          base = f"https://api.github.com/repos/{repo}/actions/caches"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jeonghan-release-cache-cleanup",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read()
                  return json.loads(body.decode()) if body else None

          def list_all():
              items = []
              page = 1
              while True:
                  payload = request(f"{base}?per_page=100&page={page}")
                  batch = list((payload or {}).get("actions_caches", []))
                  items.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              return items

          before = list_all()
          legacy = [
              item for item in before
              if (
                  str(item.get("key", "")).startswith("jeonghan-state-")
                  and not str(item.get("key", "")).startswith("jeonghan-state-v2-")
              )
              or str(item.get("key", "")).startswith("jeonghan-bot-state-")
          ]
          preserved_v2 = [
              item for item in before
              if str(item.get("key", "")).startswith("jeonghan-state-v2-")
          ]

          deleted = 0
          for item in legacy:
              cache_id = int(item["id"])
              request(f"{base}/{cache_id}", method="DELETE")
              deleted += 1

          after = list_all()
          remaining_legacy = [
              item for item in after
              if (
                  str(item.get("key", "")).startswith("jeonghan-state-")
                  and not str(item.get("key", "")).startswith("jeonghan-state-v2-")
              )
              or str(item.get("key", "")).startswith("jeonghan-bot-state-")
          ]
          after_v2 = [
              item for item in after
              if str(item.get("key", "")).startswith("jeonghan-state-v2-")
          ]

          print(f"LEGACY_CACHE_CLEANUP deleted={deleted} remaining_legacy={len(remaining_legacy)} preserved_v2_before={len(preserved_v2)} preserved_v2_after={len(after_v2)}")
          if remaining_legacy:
              sys.exit(1)
          if len(after_v2) < len(preserved_v2):
              print("Safe v2 cache count unexpectedly decreased.")
              sys.exit(1)
          PY
