name: Runtime Integrity

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies exactly like primary validation
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.txt
          python -m pip check
          python -m pip install -r requirements-optional-media.txt || true

      - name: Verify checkout and clean runtime audit
        run: |
          git rev-parse HEAD
          git status --short
          sha256sum app/phase3_recovery.py
          sed -n '1,35p' app/phase3_recovery.py
          python -m compileall -q app tests tools
          python -m app --check

      - name: Run existing unit suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Verify tests did not mutate runtime source
        if: always()
        run: |
          git status --short
          sha256sum app/phase3_recovery.py
          sed -n '1,35p' app/phase3_recovery.py
          python -m app --check
