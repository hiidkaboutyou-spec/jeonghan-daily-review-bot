name: Hani Security Diagnostics

on:
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - "requirements.txt"
      - "requirements-security.txt"
      - "requirements-maintenance.txt"
      - "requirements-maintenance.txt"
      - ".github/workflows/**"
      - "config/agent_capabilities.json"
      - ".agents/skills/**"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "requirements.txt"
      - "requirements-security.txt"
      - ".github/workflows/**"
      - "config/agent_capabilities.json"
      - ".agents/skills/**"
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, audited 2026-09-15

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, audited 2026-09-15
        with:
          python-version: "3.13"

      - name: Build isolated production dependency environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .security-target
          .security-target/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .security-target/bin/python -m pip install --disable-pip-version-check -r requirements.txt
          python -m venv .security-tools
          .security-tools/bin/python -m pip install --disable-pip-version-check -r requirements-security.txt
          TARGET_SITE=$(.security-target/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "TARGET_SITE=$TARGET_SITE" >> "$GITHUB_ENV"

      - name: Audit installed production dependencies with pip-audit
        shell: bash
        run: |
          set -euo pipefail
          .security-tools/bin/pip-audit \
            --path "$TARGET_SITE" \
            --vulnerability-service osv \
            --progress-spinner off \
            --format json \
            --output pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn
          retention-days: 14

  maintenance-dependency-audit:
    name: Maintenance dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, audited 2026-09-15

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, audited 2026-09-15
        with:
          python-version: "3.11"

      - name: Build isolated maintenance dependency environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .security-maintenance-target
          .security-maintenance-target/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .security-maintenance-target/bin/python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-maintenance.txt
          .security-maintenance-target/bin/python -m pip check
          python -m venv .security-tools
          .security-tools/bin/python -m pip install --disable-pip-version-check -r requirements-security.txt
          MAINTENANCE_TARGET_SITE=$(.security-maintenance-target/bin/python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          echo "MAINTENANCE_TARGET_SITE=$MAINTENANCE_TARGET_SITE" >> "$GITHUB_ENV"

      - name: Audit installed maintenance dependencies with pip-audit
        shell: bash
        run: |
          set -euo pipefail
          .security-tools/bin/pip-audit \
            --path "$MAINTENANCE_TARGET_SITE" \
            --vulnerability-service osv \
            --progress-spinner off \
            --format json \
            --output pip-audit-maintenance-report.json

      - name: Upload maintenance pip-audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pip-audit-maintenance-report
          path: pip-audit-maintenance-report.json
          if-no-files-found: warn
          retention-days: 14

  python-static-security:
    name: Python high-confidence static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, audited 2026-09-15

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, audited 2026-09-15
        with:
          python-version: "3.13"

      - name: Install isolated security tools
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .security-tools
          .security-tools/bin/python -m pip install --disable-pip-version-check -r requirements-security.txt

      - name: Run Bandit high-severity high-confidence gate
        shell: bash
        run: |
          set -euo pipefail
          .security-tools/bin/bandit \
            --recursive app tools \
            --severity-level high \
            --confidence-level high \
            --format json \
            --output bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: warn
          retention-days: 14
