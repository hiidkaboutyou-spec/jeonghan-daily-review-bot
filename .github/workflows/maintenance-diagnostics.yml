name: Hani Maintenance Diagnostics

on:
  pull_request:
    paths:
      - "app/**"
      - "tools/**"
      - "tests/**"
      - "requirements*.txt"
      - ".coveragerc-maintenance"
      - ".github/workflows/maintenance-diagnostics.yml"
      - "config/agent_capabilities.json"
      - "config/module_migrations.json"
      - ".agents/skills/hani-repo-maintenance/**"
      - "docs/repository-maintenance.md"
      - "docs/module-migrations.md"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "tools/**"
      - "tests/**"
      - "requirements*.txt"
      - ".coveragerc-maintenance"
      - ".github/workflows/maintenance-diagnostics.yml"
      - "config/agent_capabilities.json"
      - "config/module_migrations.json"
      - ".agents/skills/hani-repo-maintenance/**"
      - "docs/repository-maintenance.md"
      - "docs/module-migrations.md"
  schedule:
    - cron: "41 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maintenance-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-maintenance:
    name: Repository maintenance diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, audited 2026-09-15

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, audited 2026-09-15
        with:
          python-version: "3.11"

      - name: Build isolated maintenance environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .maintenance-env
          .maintenance-env/bin/python -m pip install --disable-pip-version-check --upgrade pip
          .maintenance-env/bin/python -m pip install --disable-pip-version-check -r requirements.txt -r requirements-maintenance.txt
          .maintenance-env/bin/python -m pip check

      - name: Ruff definite-error gate
        shell: bash
        run: |
          set -euo pipefail
          .maintenance-env/bin/ruff check app tools tests \
            --select E9,F63,F7,F82 \
            --output-format=github

      - name: Build Hani repository structure inventory
        shell: bash
        run: |
          set -euo pipefail
          .maintenance-env/bin/python tools/repo_structure_inventory.py \
            --json repo-structure.json \
            --markdown repo-structure.md

      - name: Validate Stage C LibCST refactor planner
        shell: bash
        run: |
          set -euo pipefail
          .maintenance-env/bin/python -m unittest tests.test_module_refactor_plan -v

      - name: Validate registered migration state
        shell: bash
        run: |
          set -euo pipefail
          .maintenance-env/bin/python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("config/module_migrations.json").read_text(encoding="utf-8"))
          active = []
          errors = []
          for item in payload["migrations"]:
              legacy = Path(item["legacy_module"].replace(".", "/") + ".py")
              canonical = Path(item["canonical_module"].replace(".", "/") + ".py")
              status = item["status"]
              if not canonical.exists():
                  errors.append(f"canonical path missing: {item['canonical_module']}")
              if status == "retired":
                  if legacy.exists():
                      errors.append(f"retired legacy path reappeared: {item['legacy_module']}")
              elif status == "compatibility-shim":
                  active.append(item["legacy_module"])
                  if not legacy.exists():
                      errors.append(f"active compatibility shim missing: {item['legacy_module']}")
              else:
                  errors.append(f"unknown migration status {status!r}: {item['legacy_module']}")
          if len(active) > 1:
              errors.append(f"more than one active Stage C compatibility shim: {active}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"registered migration state coherent; active shims: {active}")
          PY

      - name: Capture per-test Stage B coverage evidence
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail
          .maintenance-env/bin/coverage erase --rcfile=.coveragerc-maintenance
          .maintenance-env/bin/coverage run --rcfile=.coveragerc-maintenance \
            -m unittest discover -s tests -p "test_*.py"
          .maintenance-env/bin/coverage json --rcfile=.coveragerc-maintenance \
            --show-contexts -o module-test-coverage.json
          .maintenance-env/bin/coverage report --rcfile=.coveragerc-maintenance \
            --show-missing \
            app/phase3_recovery.py app/phase3_recovery_hardening.py \
            > stage-c-recovery-coverage.txt

      - name: Build Stage B module-family evidence
        shell: bash
        run: |
          set -euo pipefail
          .maintenance-env/bin/python tools/module_family_evidence.py \
            --coverage-json module-test-coverage.json \
            --json module-family-evidence.json \
            --markdown module-family-evidence.md
          rm -f module-test-coverage.json .coverage.maintenance

      - name: Collect non-blocking cleanup reports
        shell: bash
        run: |
          set -u
          .maintenance-env/bin/ruff check app tools tests --select I --output-format=concise > ruff-import-order.txt 2>&1 || true

          format_raw="$(mktemp)"
          .maintenance-env/bin/ruff format --check app tools tests > "$format_raw" 2>&1 || true
          awk '
            /^unformatted:/ {
              if (getline > 0) {
                sub(/^[[:space:]]*-->[[:space:]]*/, "")
                sub(/:[0-9]+:[0-9]+$/, "")
                print
              }
            }
          ' "$format_raw" | sort -u > ruff-format-check.txt
          rm -f "$format_raw"

          .maintenance-env/bin/vulture app tools --min-confidence 90 --sort-by-size > vulture-high-confidence.txt 2>&1 || true
          NO_COLOR=1 .maintenance-env/bin/complexipy app --failed > complexipy-hotspots.txt 2>&1 || true

          .maintenance-env/bin/deptry . \
            --requirements-files requirements.txt \
            --known-first-party app \
            --known-first-party tools \
            --extend-exclude "\\.maintenance-env|tools/module_family_evidence\\.py|tools/module_refactor_plan\\.py" \
            --per-rule-ignores "DEP001=daily_watchdog|daily_watchdog_transport,DEP002=agent-reach|twitter-cli|uvicorn" \
            --no-ansi > deptry-report.txt 2>&1 || true

      - name: Explain enforcement level
        shell: bash
        run: |
          {
            echo "### Hani maintenance diagnostics"
            echo "- Ruff definite Python errors: blocking."
            echo "- Stage B Grimp import-chain evidence: report-only; never authorizes moves/deletions."
            echo "- Stage B Coverage.py per-test evidence: collected on PR/manual/scheduled runs; no global coverage threshold yet."
            echo "- Stage C LibCST refactor planner: blocking self-tests and available for future planning; no automatic apply."
            echo "- Registered Stage C migration guard: retired paths must stay absent; at most one compatibility shim may be active at a time."
            echo "- No retired Stage C path receives a recurring migration plan; future candidates require a new planning-first evidence pass."
            echo "- Import ordering and formatting: report-only during cleanup rollout."
            echo "- Vulture dead-code candidates: report-only; never auto-delete."
            echo "- Complexipy cognitive-complexity hotspots: report-only; used to prioritize human-reviewed refactors."
            echo "- Deptry production dependency candidates: report-only; maintenance-only scripts are outside that production dependency graph."
            echo "- Repository inventory: maps responsibilities and historical phase/fix naming without moving runtime modules."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload maintenance reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hani-maintenance-reports
          path: |
            repo-structure.json
            repo-structure.md
            module-family-evidence.json
            module-family-evidence.md
            stage-c-recovery-coverage.txt
            ruff-import-order.txt
            ruff-format-check.txt
            vulture-high-confidence.txt
            complexipy-hotspots.txt
            deptry-report.txt
          if-no-files-found: warn
          retention-days: 14
