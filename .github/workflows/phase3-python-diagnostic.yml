name: Phase 3 Python Diagnostic

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose-python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python
        id: compile
        continue-on-error: true
        run: python -m compileall -q app tests tools

      - name: App configuration check
        id: appcheck
        continue-on-error: true
        env:
          ALLOW_TEST_PLACEHOLDERS: "true"
          PYTHONUNBUFFERED: "1"
        run: python -m app --check

      - name: Unit tests
        id: unittest
        continue-on-error: true
        env:
          ALLOW_TEST_PLACEHOLDERS: "true"
          PYTHONUNBUFFERED: "1"
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Fail if validation failed
        if: always()
        shell: bash
        run: |
          echo "compile outcome: ${{ steps.compile.outcome }}"
          echo "app-check outcome: ${{ steps.appcheck.outcome }}"
          echo "unittest outcome: ${{ steps.unittest.outcome }}"
          if [ "${{ steps.compile.outcome }}" != "success" ] || \
             [ "${{ steps.appcheck.outcome }}" != "success" ] || \
             [ "${{ steps.unittest.outcome }}" != "success" ]; then
            exit 1
          fi
