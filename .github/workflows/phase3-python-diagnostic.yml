name: Phase 3 Python Diagnostic

on:
  pull_request:
    branches: [ main ]

jobs:
  diagnose-python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Diagnose exact validation commands
        env:
          ALLOW_TEST_PLACEHOLDERS: "true"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set +e

          echo '=== compileall: app tests tools ==='
          python -m compileall -q app tests tools
          compile_rc=$?
          echo "compileall exit=$compile_rc"

          echo '=== app --check ==='
          python -m app --check
          check_rc=$?
          echo "app --check exit=$check_rc"

          echo '=== unittest discover ==='
          python -m unittest discover -s tests -p "test_*.py" -v
          test_rc=$?
          echo "unittest exit=$test_rc"

          if [ "$compile_rc" -ne 0 ] || [ "$check_rc" -ne 0 ] || [ "$test_rc" -ne 0 ]; then
            exit 1
          fi
