name: Phase 3 Python Diagnostic

on:
  pull_request:
    branches: [ main ]

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall -q app tests tools

  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: App configuration check
        env:
          ALLOW_TEST_PLACEHOLDERS: "true"
          PYTHONUNBUFFERED: "1"
        run: python -m app --check

  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests with surfaced failure lines
        env:
          ALLOW_TEST_PLACEHOLDERS: "true"
          PYTHONUNBUFFERED: "1"
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee unittest.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo '=== failing-test summary ==='
            grep -E '^(FAIL|ERROR):|^FAILED|Traceback|AssertionError|ImportError|ModuleNotFoundError' unittest.log | tail -n 120 || true
            echo "::error title=Python unit tests failed::unittest exit code $rc; see failing-test summary above"
          fi
          exit "$rc"
