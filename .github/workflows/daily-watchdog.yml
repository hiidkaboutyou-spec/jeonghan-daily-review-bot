name: Jeonghan Daily Watchdog

on:
  workflow_run:
    workflows:
      - Jeonghan Daily Review Bot
    types:
      - completed

permissions:
  contents: read
  actions: write

jobs:
  watchdog:
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: jeonghan-daily-watchdog-main
      cancel-in-progress: true
    steps:
      - name: Checkout current production main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Run bounded Daily watchdog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          SOURCE_EVENT: ${{ github.event.workflow_run.event }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_ACTOR: ${{ github.event.workflow_run.actor.login }}
        run: python tools/daily_watchdog.py
