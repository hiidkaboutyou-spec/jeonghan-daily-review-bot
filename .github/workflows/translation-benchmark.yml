name: Channel Style Translation Benchmark

on:
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "config/**"
      - "data/translation_benchmark_cases.json"
      - "data/translation_benchmark_human_reviews.json"
      - "docs/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - ".github/workflows/translation-benchmark.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "Editorial evaluation to run"
        required: true
        default: translation-human
        type: choice
        options:
          - translation-human
          - writing-quality-finalization

permissions:
  contents: read

# Pull requests use bounded deterministic foundation benchmarks plus the existing
# live EN/KO/JA translation smoke. Human/editorial style certification remains a
# separate manual action and is never inferred from deterministic checks.
concurrency:
  group: channel-style-translation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-smoke:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate translation project
        run: |
          python -m compileall -q app tests tools
          python -m app --check
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Private-Review Final-Edit Capture foundation benchmark
        run: python -m tools.run_private_review_final_edit_capture_benchmark

      - name: Forward-ready private-review UX foundation benchmark
        run: python -m tools.run_forward_ready_benchmark

      - name: Fused Private-Review Delivery foundation benchmark
        run: python -m tools.run_fused_private_review_delivery_benchmark

      - name: Direct User Style Rules foundation benchmark
        run: python -m tools.run_direct_user_style_rules_benchmark

      - name: Channel Style Rewrite foundation benchmark
        run: python -m tools.run_channel_style_rewrite_benchmark

      - name: User-Voice Calibration foundation benchmark
        run: python -m tools.run_user_voice_calibration_benchmark

      - name: Translation Fusion foundation benchmark
        run: python -m tools.run_translation_fusion_benchmark

      - name: Event Fusion foundation benchmark
        run: python -m tools.run_event_fusion_benchmark

      - name: Event Timeline foundation benchmark
        run: python -m tools.run_event_timeline_benchmark

      - name: Live EN KO JA production translation smoke
        run: python -m tools.run_translation_production_smoke

  human-benchmark:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'translation-human'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate translation project
        run: |
          python -m compileall -q app tests tools
          python -m app --check
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Restore PART 4 benchmark checkpoint
        uses: actions/cache/restore@v5
        with:
          path: .state/part4-real-benchmark.json
          key: part4-benchmark-v8-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            part4-benchmark-v8-${{ runner.os }}-${{ github.ref_name }}-
            part4-benchmark-v7-${{ runner.os }}-${{ github.ref_name }}-

      - name: Generate full PART 4 human-gate benchmark
        id: benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        shell: bash
        run: |
          set +e
          python -m tools.run_translation_benchmark_human \
            --output .state/part4-real-benchmark.json \
            --pace-seconds 8 \
            --batch-size 3 \
            --batch-cooldown-seconds 65 \
            --max-quota-retries 1 \
            --resume
          benchmark_exit=$?
          set -e
          python -m tools.benchmark_status \
            --checkpoint .state/part4-real-benchmark.json \
            --exit-code "$benchmark_exit"

      - name: Publish benchmark status summary
        if: always() && steps.benchmark.outputs.status != ''
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outputs.status }}
        run: |
          {
            echo "## Translation human benchmark"
            echo
            echo "- Live benchmark status: $BENCHMARK_STATUS"
            echo "- Human/editorial certification remains bound to exact reviewed output hashes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save PART 4 benchmark checkpoint
        if: always() && hashFiles('.state/part4-real-benchmark.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state/part4-real-benchmark.json
          key: part4-benchmark-v8-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload PART 4 benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part4-real-translation-benchmark
          path: .state/part4-real-benchmark.json
          if-no-files-found: error
          retention-days: 14

  writing-quality-finalization:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'writing-quality-finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash-lite
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate evaluation tooling
        run: |
          python -m compileall -q app tests tools
          python -m app --check

      - name: Run 50-post translation A/B and 20-work fic evaluation
        run: >-
          python -m tools.run_writing_quality_evaluation
          --output .state/writing-quality-evaluation.json
          --section all
          --pace-seconds 4.5

      - name: Publish evaluation summary
        if: always() && hashFiles('.state/writing-quality-evaluation.json') != ''
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path('.state/writing-quality-evaluation.json').read_text(encoding='utf-8'))
          translation = payload.get('translation', {})
          fic = payload.get('fic', {})
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as out:
              out.write('## Writing quality finalization\n\n')
              out.write(f"- Translation cases: {translation.get('case_count', 0)}\n")
              out.write(f"- Translation preferences: {translation.get('preference_counts', {})}\n")
              out.write(f"- Baseline means: {translation.get('baseline_means', {})}\n")
              out.write(f"- Voice-aware means: {translation.get('voice_aware_means', {})}\n")
              out.write(f"- Fic metadata samples: {fic.get('case_count', 0)}\n")
              out.write(f"- Fic means: {fic.get('score_means', {})}\n")
              out.write(f"- Fic hallucinations: {fic.get('hallucination_count', 0)}\n")
              out.write(f"- Fic sanitization findings: {fic.get('sanitization_count', 0)}\n")
          PY

      - name: Upload writing quality evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writing-quality-evaluation-${{ github.sha }}
          path: .state/writing-quality-evaluation.json
          if-no-files-found: error
          retention-days: 14
