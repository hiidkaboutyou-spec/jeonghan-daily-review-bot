name: Rust Editorial Core

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "app/completeness*.py"
      - "tests/test_completeness_engine.py"
      - ".github/workflows/rust-editorial-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "app/completeness*.py"
      - "tests/test_completeness_engine.py"
      - ".github/workflows/rust-editorial-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-editorial-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Build JSONL executable
        run: cargo build --locked --workspace

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python Rust completeness integration
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p test_completeness_engine.py -v
