name: Rust Editorial Core

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "app/completeness*.py"
      - "tests/test_completeness*.py"
      - ".github/workflows/rust-editorial-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "app/completeness*.py"
      - "tests/test_completeness*.py"
      - ".github/workflows/rust-editorial-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-editorial-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rust-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, audited 2026-09-15
        with:
          persist-credentials: false

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, audited 2026-09-18
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features

      - name: Build JSONL executable
        run: cargo build --locked --workspace

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, audited 2026-09-15
        with:
          python-version: "3.11"

      - name: Python Rust completeness integration
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p "test_completeness*.py" -v
