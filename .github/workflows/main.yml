name: Jeonghan Daily Review Bot

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "اجرای کامل یا فقط بررسی فایل‌ها"
        required: true
        default: live
        type: choice
        options:
          - live
          - check

  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: jeonghan-daily-review-bot
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 14

    defaults:
      run:
        working-directory: jeonghan-daily-review-bot-v2/jeonghan-daily-review-bot-v2

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jeonghan-daily-review-bot-v2/jeonghan-daily-review-bot-v2/requirements.txt

      - name: Restore persistent bot state
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'live'
        id: state-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: jeonghan-daily-review-bot-v2/jeonghan-daily-review-bot-v2/state/state.json
          key: jeonghan-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jeonghan-state-${{ runner.os }}-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate files and run tests
        run: |
          python -m src.bot --check
          python -m unittest discover -s tests -p "test_bot.py" -v

      - name: Run bot
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'live'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
        run: python -m src.bot

      - name: Save persistent bot state
        if: >-
          always() &&
          (github.event_name != 'workflow_dispatch' || inputs.mode == 'live') &&
          hashFiles('jeonghan-daily-review-bot-v2/jeonghan-daily-review-bot-v2/state/state.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: jeonghan-daily-review-bot-v2/jeonghan-daily-review-bot-v2/state/state.json
          key: ${{ steps.state-cache.outputs.cache-primary-key }}
