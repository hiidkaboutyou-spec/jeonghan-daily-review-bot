name: Jeonghan Daily Review Bot

on:
  push:
    branches:
      - main
      - "agent/**"
      - "repair/**"
    paths:
      - "app/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "فقط تست یا اجرای واقعی"
        required: true
        default: check
        type: choice
        options:
          - check
          - live
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: jeonghan-daily-review-bot-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'validation' || 'runtime' }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "FFmpeg is not preinstalled; using bounded apt fallback."
            timeout 120s sudo apt-get update -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
            timeout 120s sudo apt-get install -y -qq ffmpeg
            ffmpeg -version | head -n 1
          fi

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Restore bot state
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        uses: actions/cache/restore@v5
        with:
          # Cache only application state. Never cache/restore .state/x_accounts.db:
          # twscrape stores authenticated X cookie material in that SQLite database.
          path: .state/state.json
          key: jeonghan-state-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jeonghan-state-v2-${{ runner.os }}-

      - name: Validate project
        run: |
          python -m compileall -q app tests tools
          python -m app --check
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run private review bot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          echo "Starting responsive Telegram review window."
          end=$((SECONDS + 780))
          successful_passes=0
          while [ "$SECONDS" -lt "$end" ]; do
            set +e
            python -m app
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              successful_passes=$((successful_passes + 1))
            elif [ "$code" -eq 2 ]; then
              echo "Fatal configuration error; stopping instead of retrying."
              exit "$code"
            else
              echo "Bot pass failed with exit code $code; retrying."
            fi
            sleep 5
          done
          if [ "$successful_passes" -eq 0 ]; then
            echo "No bot pass completed successfully during the live window."
            exit 1
          fi
          echo "Live window completed with $successful_passes successful bot pass(es)."

      - name: Save bot state
        if: >-
          always() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) &&
          hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state/state.json
          key: jeonghan-state-v2-${{ runner.os }}-${{ github.run_id }}
