name: Jeonghan Daily Review Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: jeonghan-daily-review-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: jeonghan-daily-review-bot-v2/requirements.txt

      - name: Restore persistent bot state
        id: state-cache
        uses: actions/cache/restore@v4
        with:
          path: jeonghan-daily-review-bot-v2/state/state.json
          key: jeonghan-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jeonghan-state-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r jeonghan-daily-review-bot-v2/requirements.txt

      - name: Validate bot
        run: |
          python -m py_compile jeonghan-daily-review-bot-v2/src/bot.py
          python -m unittest discover -s jeonghan-daily-review-bot-v2/tests -v

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
        run: |
          cd jeonghan-daily-review-bot-v2
          python -m src.bot

      - name: Save persistent bot state
        if: always() && hashFiles('jeonghan-daily-review-bot-v2/state/state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: jeonghan-daily-review-bot-v2/state/state.json
          key: ${{ steps.state-cache.outputs.cache-primary-key }}
