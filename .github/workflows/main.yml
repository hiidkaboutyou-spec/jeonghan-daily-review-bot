name: Jeonghan Daily Review Bot

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "config/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "فقط تست یا اجرای واقعی"
        required: true
        default: check
        type: choice
        options:
          - check
          - live
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

concurrency:
  group: jeonghan-daily-review-bot
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Restore bot state
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        uses: actions/cache/restore@v5
        with:
          path: .state
          key: jeonghan-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jeonghan-state-${{ runner.os }}-

      - name: Validate project
        run: |
          python -m compileall -q app tests
          python -m app --check
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run private review bot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          echo "Starting responsive Telegram review window."
          end=$((SECONDS + 780))
          while [ "$SECONDS" -lt "$end" ]; do
            set +e
            python -m app
            code=$?
            set -e
            if [ "$code" -eq 2 ]; then
              echo "Fatal configuration error; stopping instead of retrying."
              exit "$code"
            fi
            sleep 5
          done

      - name: Save bot state
        if: >-
          always() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) &&
          hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state
          key: jeonghan-state-${{ runner.os }}-${{ github.run_id }}
