name: Jeonghan Daily Review Bot

on:
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "app/**"
      - "config/**"
      - "data/translation_benchmark_cases.json"
      - "docs/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - "requirements-optional-media.txt"
      - ".github/workflows/main.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "config/**"
      - "data/translation_benchmark_cases.json"
      - "docs/**"
      - "tests/**"
      - "tools/**"
      - "requirements.txt"
      - "requirements-optional-media.txt"
      - ".github/workflows/main.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "فقط تست یا اجرای واقعی"
        required: true
        default: check
        type: choice
        options:
          - check
          - live
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read

# Translation benchmark work is expensive and checkpointed. New PR commits may
# replace an older pending run, but an already-running benchmark is allowed to
# finish so its checkpoint/artifact is not lost. Runtime runs remain serialized
# by the same group.
concurrency:
  group: jeonghan-daily-review-bot-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && 'validation' || 'runtime' }}
  cancel-in-progress: false

jobs:
  validate-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: FFmpeg
        timeout-minutes: 5
        shell: bash
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
            exit 0
          fi

          for attempt in 1 2; do
            echo "Installing FFmpeg (attempt $attempt/2)."
            if timeout 120s sudo apt-get \
                 -o Acquire::Retries=2 \
                 -o Acquire::http::Timeout=20 \
                 -o Acquire::https::Timeout=20 \
                 update -qq && \
               timeout 120s sudo apt-get \
                 -o Dpkg::Use-Pty=0 \
                 install -y -qq ffmpeg; then
              ffmpeg -version | head -n 1
              exit 0
            fi
            echo "FFmpeg install attempt $attempt failed or timed out."
            sleep 5
          done

          echo "FFmpeg installation failed after bounded retries."
          exit 1

      - name: Install
        shell: bash
        run: |
          python -m pip install -r requirements.txt
          if ! python -m pip install -r requirements-optional-media.txt; then
            echo "::warning::Optional gallery-dl install failed; existing direct/yt-dlp/FFmpeg fallbacks remain available."
          fi

      - name: Restore bot state
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        uses: actions/cache/restore@v5
        with:
          path: .state/state.json
          key: jeonghan-state-v2-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jeonghan-state-v2-${{ runner.os }}-

      - name: Restore private review database
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        uses: actions/cache/restore@v5
        with:
          path: .state/private-review.sqlite3
          key: jeonghan-private-review-v1-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            jeonghan-private-review-v1-${{ runner.os }}-

      - name: Validate project
        run: |
          python -m compileall -q app tests tools
          python -m app --check
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Restore PART 4 benchmark checkpoint
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache/restore@v5
        with:
          path: .state/part4-real-benchmark.json
          key: part4-benchmark-v3-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            part4-benchmark-v3-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-

      - name: Generate PART 4 real translation benchmark
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        timeout-minutes: 20
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: |
          python -m tools.run_translation_benchmark_human \
            --output .state/part4-real-benchmark.json \
            --pace-seconds 8 \
            --batch-size 1 \
            --batch-cooldown-seconds 65 \
            --max-quota-retries 1 \
            --resume

      - name: Save PART 4 benchmark checkpoint
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('.state/part4-real-benchmark.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state/part4-real-benchmark.json
          key: part4-benchmark-v3-${{ runner.os }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload PART 4 benchmark artifact
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: part4-real-translation-benchmark
          path: .state/part4-real-benchmark.json
          if-no-files-found: error
          retention-days: 7

      - name: Run private review bot
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          echo "Starting responsive Telegram review window."
          end=$((SECONDS + 780))
          successful_passes=0
          while [ "$SECONDS" -lt "$end" ]; do
            set +e
            python -m app
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              successful_passes=$((successful_passes + 1))
            elif [ "$code" -eq 2 ]; then
              echo "Fatal configuration error; stopping instead of retrying."
              exit "$code"
            else
              echo "Bot pass failed with exit code $code; retrying."
            fi
            sleep 5
          done
          if [ "$successful_passes" -eq 0 ]; then
            echo "No bot pass completed successfully during the live window."
            exit 1
          fi
          echo "Live window completed with $successful_passes successful bot pass(es)."

      - name: Checkpoint private review database
        if: >-
          always() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) &&
          hashFiles('.state/private-review.sqlite3') != ''
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          path = Path('.state/private-review.sqlite3')
          if path.exists():
              conn = sqlite3.connect(path, timeout=15)
              try:
                  conn.execute('PRAGMA wal_checkpoint(TRUNCATE)').fetchall()
              finally:
                  conn.close()
          PY

      - name: Save bot state
        if: >-
          always() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) &&
          hashFiles('.state/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .state/state.json
          key: jeonghan-state-v2-${{ runner.os }}-${{ github.run_id }}

      - name: Save private review database
        if: >-
          always() &&
          (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'live')) &&
          hashFiles('.state/private-review.sqlite3') != ''
        uses: actions/cache/save@v5
        with:
          path: .state/private-review.sqlite3
          key: jeonghan-private-review-v1-${{ runner.os }}-${{ github.run_id }}
