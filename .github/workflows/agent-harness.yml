name: Agent Harness Contract

on:
  push:
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - "tools/validate_agent_harness.py"
      - ".github/workflows/agent-harness.yml"
  pull_request:
    paths:
      - "AGENTS.md"
      - ".agents/skills/**"
      - "tools/validate_agent_harness.py"
      - ".github/workflows/agent-harness.yml"

permissions:
  contents: read

concurrency:
  group: agent-harness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Validate repository agent contract
        run: python tools/validate_agent_harness.py
