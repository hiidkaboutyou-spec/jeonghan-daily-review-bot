name: Render Production Validation

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "render.yaml"
      - "requirements.txt"
      - "requirements-optional-media.txt"
      - "app/**"
      - "config/**"
      - ".github/workflows/render-validate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "render.yaml"
      - "requirements.txt"
      - "requirements-optional-media.txt"
      - "app/**"
      - "config/**"
      - ".github/workflows/render-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-render-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install core dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.2"
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Validate application and Render config
        run: |
          python -m compileall -q app tools
          python -m app --check
          python - <<'PY'
          from pathlib import Path
          text = Path('render.yaml').read_text(encoding='utf-8')
          required = [
              'runtime: docker',
              'plan: free',
              'healthCheckPath: /healthz',
              'TELEGRAM_BOT_TOKEN',
              'TELEGRAM_ADMIN_USER_ID',
              'TELEGRAM_REVIEW_CHAT_ID',
              'X_COOKIE',
              'GEMINI_API_KEY',
              'GEMINI_MODEL',
              'STATE_BACKUP_KEY',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('render.yaml missing: ' + ', '.join(missing))
          PY

      - name: Build exact production Docker image
        run: docker build --pull -t jeonghan-personal-assistant:ci .
