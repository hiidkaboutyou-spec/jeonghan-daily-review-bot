name: Nightly Jeonghan Fanfic Digest

on:
  workflow_dispatch:
  schedule:
    # 22:00 Tehran = 18:30 UTC
    - cron: "30 18 * * *"
  push:
    branches:
      - main
    paths:
      - "app/fic_digest.py"
      - "requirements.txt"
      - ".github/workflows/fic-digest.yml"

permissions:
  contents: read

concurrency:
  group: nightly-jeonghan-fic-digest-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements.txt

      - name: Validate imports
        run: |
          python -m py_compile app/fic_digest.py
          python -c "import app.fic_digest; print('fanfic digest import OK')"

      - name: Build and send two separate nightly lists
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          X_COOKIE: ${{ secrets.X_COOKIE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
        run: python -m app.fic_digest
