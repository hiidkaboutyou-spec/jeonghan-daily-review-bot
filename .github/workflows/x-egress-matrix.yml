name: X Egress Runner Matrix

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/x-egress-matrix.yml"
      - "tools/x_egress_matrix_probe.py"

permissions:
  contents: read

jobs:
  anonymous-probe:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Probe public X page without credentials
        run: python tools/x_egress_matrix_probe.py
