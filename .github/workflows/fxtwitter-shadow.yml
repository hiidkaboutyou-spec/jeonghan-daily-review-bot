name: FxTwitter Shadow Completeness

on:
  pull_request:
    paths:
      - ".github/workflows/fxtwitter-shadow.yml"
      - "tools/fxtwitter_shadow_probe.py"
      - "tests/test_fxtwitter_shadow_probe.py"
      - "config/sources.json"
      - "config/jeonghan_priority_x_sources.json"
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Read-only source window to prove"
        required: false
        default: "24"

permissions:
  contents: read

concurrency:
  group: fxtwitter-shadow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove-window:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # releases/v6, audited 2026-09-15
        with:
          persist-credentials: false

      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # releases/v6, audited 2026-09-15
        with:
          python-version: "3.11"

      - name: Unit-test conservative completeness rules
        run: python -m unittest tests.test_fxtwitter_shadow_probe -v

      - name: Probe every enabled source without delivery or state mutation
        env:
          LOOKBACK_HOURS: ${{ github.event.inputs.lookback_hours || '24' }}
        run: |
          python -m tools.fxtwitter_shadow_probe \
            --lookback-hours "$LOOKBACK_HOURS" \
            --page-size 100 \
            --max-pages 10 \
            --timeout 10 \
            --workers 6 \
            --output fxtwitter-shadow.json \
            --require-complete

      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fxtwitter-shadow-${{ github.run_id }}
          path: fxtwitter-shadow.json
          if-no-files-found: warn
          retention-days: 14
